# Despliegue en Render conectado a GitHub
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: solucionsneqs
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DISCORD_CLIENT_ID
        value: "1504930494402265238"
      # ID del canal #eltiranguulo en Pirlo420 (clic derecho > Copiar ID del canal)
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: DISCORD_BOT_TOKEN
        sync: false
